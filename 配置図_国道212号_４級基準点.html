<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>配置図｜国道212号 流木対策工 ４級基準点</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  :root{
    --paper:#f6f4ee;
    --grid-minor:#dcd6c4;
    --grid-major:#c2b998;
    --ink:#1f2a24;
    --ink-soft:#5b6459;
    --line:#8a8272;
    --in-color:#b3401f;
    --mt-color:#1f5f6b;
    --accent:#c96a2e;
    --panel-bg:#fffdf8;
    --panel-border:#d8d0ba;
    --header-h:64px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans JP',sans-serif;
    overflow:hidden;
  }
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ------- header ------- */
  header{
    position:fixed; top:0; left:0; right:0; min-height:var(--header-h);
    background:var(--paper);
    border-bottom:2px solid var(--ink);
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:8px;
    padding:10px 18px; z-index:50;
  }
  .title-block{display:flex; flex-direction:column; line-height:1.25;}
  .title-block .eyebrow{
    font-size:10px; letter-spacing:.18em; color:var(--ink-soft); font-weight:700;
  }
  .title-block h1{
    margin:0; font-size:17px; font-weight:900; letter-spacing:.01em;
  }
  .meta{
    display:flex; gap:18px; align-items:center;
  }
  .meta .item{display:flex; flex-direction:column; align-items:flex-end; line-height:1.2;}
  .meta .item .k{font-size:9px; color:var(--ink-soft); letter-spacing:.1em;}
  .meta .item .v{font-size:12px; font-weight:700;}
  .print-btn{
    border:1.5px solid var(--ink); background:var(--ink); color:var(--paper);
    font-family:'Noto Sans JP',sans-serif; font-weight:700; font-size:12px;
    padding:8px 14px; cursor:pointer; letter-spacing:.03em;
  }
  .print-btn:hover{background:var(--accent); border-color:var(--accent);}

  .view-toggle{
    display:flex; border:1.5px solid var(--ink); border-radius:2px; overflow:hidden; margin-right:10px;
  }
  .view-toggle button{
    border:none; background:var(--paper); color:var(--ink);
    font-family:'Noto Sans JP',sans-serif; font-weight:700; font-size:12px;
    padding:8px 14px; cursor:pointer;
  }
  .view-toggle button + button{border-left:1.5px solid var(--ink);}
  .view-toggle button.active{background:var(--ink); color:var(--paper);}

  #mapview{position:absolute; top:0; left:0; right:280px; bottom:0; display:none;}
  #mapview.active{display:block;}
  #stage.hidden{display:none;}
  .leaflet-popup-content{font-family:'Noto Sans JP',sans-serif; font-size:12.5px;}
  .leaflet-popup-content .mono{font-family:'JetBrains Mono',monospace;}
  .basemap-switch{
    position:absolute; left:16px; top:14px; z-index:500;
    display:flex; flex-direction:column; border:1.5px solid var(--ink); background:var(--panel-bg);
    font-size:11.5px; overflow:hidden;
  }
  .basemap-switch button{
    border:none; background:transparent; padding:7px 12px; text-align:left; cursor:pointer;
    border-bottom:1px solid var(--panel-border); font-family:'Noto Sans JP',sans-serif; font-weight:500;
  }
  .basemap-switch button:last-child{border-bottom:none;}
  .basemap-switch button.active{background:var(--accent); color:#fff; font-weight:700;}

  .geoctl{
    position:absolute; left:16px; bottom:14px; z-index:500;
  }
  .geoctl button{
    border:1.5px solid var(--ink); background:var(--panel-bg); color:var(--ink);
    font-family:'Noto Sans JP',sans-serif; font-weight:700; font-size:12.5px;
    padding:10px 16px; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.18);
  }
  .geoctl button.active{background:#1a6b3a; color:#fff; border-color:#1a6b3a;}
  .geoinfo{
    position:absolute; left:16px; bottom:64px; z-index:500;
    background:var(--panel-bg); border:1.5px solid var(--ink); padding:9px 12px;
    font-size:11.5px; min-width:180px; box-shadow:0 1px 4px rgba(0,0,0,.18);
  }
  .geoinfo .glabel{font-size:9.5px; letter-spacing:.12em; color:var(--ink-soft); margin-bottom:4px; font-weight:700;}
  .geoinfo .gnearest{margin-top:5px; font-weight:700; color:var(--accent); font-size:12.5px;}
  .gnav-target{font-weight:700; font-size:12.5px; margin-top:4px;}
  .gnav-row{display:flex; align-items:center; gap:10px; margin-top:6px;}
  #geoArrow{flex-shrink:0; transition:transform .25s ease;}
  .gnav-dist{font-weight:900; font-size:17px; font-family:'JetBrains Mono',monospace; line-height:1;}
  .gnav-bearing{font-size:11px; color:var(--ink-soft); margin-top:2px;}
  .gnav-clear{
    margin-top:8px; width:100%; border:1px solid var(--panel-border); background:transparent;
    color:var(--ink-soft); font-size:11px; padding:5px; cursor:pointer; font-family:'Noto Sans JP',sans-serif;
  }
  .gnav-clear:hover{border-color:var(--in-color); color:var(--in-color);}

  .detail-navbtn{
    margin-top:10px; width:100%; border:1.5px solid var(--ink); background:#fff; color:var(--ink);
    font-weight:700; font-size:12px; padding:8px; cursor:pointer; font-family:'Noto Sans JP',sans-serif;
  }
  .detail-navbtn:hover{background:var(--ink); color:var(--paper);}
  .detail-navbtn.is-target{background:#1a6b3a; color:#fff; border-color:#1a6b3a;}

  .pbadge{font-size:11px;}
  .photo-section{display:flex; gap:10px; margin-top:12px;}
  .photo-slot{flex:1; display:flex; flex-direction:column; gap:6px;}
  .photo-label{font-size:11px; font-weight:700; color:var(--ink-soft);}
  .photo-thumb{
    width:100%; aspect-ratio:4/3; background:#efe9d8; border:1px solid var(--panel-border);
    display:flex; align-items:center; justify-content:center; overflow:hidden; border-radius:3px;
  }
  .photo-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .photo-empty{font-size:10px; color:var(--ink-soft);}
  .photo-actions{display:flex; gap:4px;}
  .photo-btn{
    flex:1; font-size:10.5px; padding:6px 4px; border:1px solid var(--ink); background:#fff;
    cursor:pointer; font-family:'Noto Sans JP',sans-serif; font-weight:700;
  }
  .photo-btn:hover{background:var(--ink); color:#fff;}
  .photo-del{
    font-size:10.5px; padding:6px 8px; border:1px solid var(--panel-border); background:#fff;
    color:var(--ink-soft); cursor:pointer; font-family:'Noto Sans JP',sans-serif;
  }
  .photo-del:hover{border-color:var(--in-color); color:var(--in-color);}

  .report-btn{
    border:1.5px solid var(--ink); background:#fff; color:var(--ink);
    font-family:'Noto Sans JP',sans-serif; font-weight:700; font-size:12px;
    padding:8px 14px; cursor:pointer; margin-right:10px;
  }
  .report-btn:hover{background:var(--accent); border-color:var(--accent); color:#fff;}

  #reportView{
    position:fixed; inset:0; background:#fff; z-index:2000; overflow-y:auto;
    padding:24px; display:none; font-family:'Noto Sans JP',sans-serif; color:var(--ink);
  }
  #reportView.open{display:block;}
  .report-header{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
    border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:16px;
  }
  .report-header h2{font-size:16px; margin:0;}
  .report-actions button{
    border:1.5px solid var(--ink); background:#fff; padding:8px 12px; font-size:12px; font-weight:700;
    cursor:pointer; margin-left:6px; font-family:'Noto Sans JP',sans-serif;
  }
  .report-actions button:hover{background:var(--ink); color:#fff;}
  .report-progress{margin-bottom:14px; font-size:12.5px; color:var(--ink-soft);}
  .report-card{
    border:1px solid var(--panel-border); border-radius:4px; padding:14px; margin-bottom:14px;
    break-inside:avoid; page-break-inside:avoid;
  }
  .report-card-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; flex-wrap:wrap; gap:6px;}
  .report-card-head .rname{font-size:16px; font-weight:900;}
  .report-card-head .rmeta{font-size:11px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace;}
  .report-coords{font-size:11.5px; font-family:'JetBrains Mono',monospace; color:var(--ink-soft); margin-bottom:10px;}
  .report-photos{display:flex; gap:12px;}
  .report-photo{flex:1;}
  .report-photo .rlabel{font-size:10.5px; font-weight:700; color:var(--ink-soft); margin-bottom:4px;}
  .report-photo img{width:100%; aspect-ratio:4/3; object-fit:cover; border:1px solid var(--panel-border); border-radius:3px; display:block;}
  .report-photo .rmissing{
    width:100%; aspect-ratio:4/3; background:#f2efe4; border:1px dashed var(--panel-border);
    display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:11px; border-radius:3px;
  }
  @media print{
    body > *:not(#reportView){display:none !important;}
    #reportView{position:static; padding:0;}
    .report-actions{display:none !important;}
    .report-card{page-break-inside:avoid;}
  }

  .pt-row.nav-target{border-color:#1a6b3a;}
  .pt-row.nav-target::after{content:"🎯"; margin-left:auto; padding-left:6px; font-size:11px;}

  .target-banner{
    position:absolute; top:14px; left:16px; right:296px; width:fit-content; margin:0 auto; z-index:500;
    background:#1a6b3a; color:#fff; padding:8px 10px 8px 14px; border-radius:3px;
    display:flex; align-items:center; justify-content:center; gap:10px; font-size:12.5px; font-weight:700;
    box-shadow:0 2px 6px rgba(0,0,0,.25); white-space:nowrap;
  }
  .target-banner button{
    background:rgba(255,255,255,.25); border:none; color:#fff; width:20px; height:20px;
    border-radius:50%; cursor:pointer; font-size:12px; line-height:1; flex-shrink:0;
  }
  .target-banner button:hover{background:rgba(255,255,255,.45);}
  @keyframes targetPulse{
    0%{ opacity:1; }
    70%{ opacity:.12; }
    100%{ opacity:1; }
  }
  .target-pulse{ animation: targetPulse 1.3s ease-in-out infinite; }

  /* ------- layout ------- */
  main{
    position:fixed; top:var(--header-h); left:0; right:0; bottom:0;
    display:flex;
  }
  #stage{
    flex:1; position:relative; overflow:hidden; cursor:grab;
    touch-action:none;
    background-image:
      linear-gradient(var(--grid-minor) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-minor) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  #stage.grabbing{cursor:grabbing;}
  #stage svg{position:absolute; top:0; left:0; width:100%; height:100%;}

  aside{
    width:280px; flex-shrink:0;
    background:var(--panel-bg); border-left:2px solid var(--ink);
    overflow-y:auto; padding:16px 16px 90px;
  }
  aside h2{
    font-size:11px; letter-spacing:.14em; color:var(--ink-soft); margin:0 0 10px;
    border-bottom:1px solid var(--panel-border); padding-bottom:6px;
  }
  .legend-row{
    display:flex; align-items:center; gap:8px; font-size:12.5px; margin-bottom:8px; cursor:pointer;
    user-select:none;
  }
  .legend-row input{accent-color:var(--ink); width:14px; height:14px;}
  .swatch{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:2px solid var(--ink);}
  .swatch.in{background:var(--in-color);}
  .swatch.mt{background:var(--mt-color); border-radius:3px;}
  .legend-row.dim{opacity:.4;}

  .pt-list{margin-top:14px; display:flex; flex-direction:column; gap:4px;}
  .pt-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 8px; border:1px solid transparent; border-radius:2px;
    cursor:pointer; font-size:12px;
  }
  .pt-row:hover{background:#efe9d8;}
  .pt-row.active{border-color:var(--ink); background:#efe9d8;}
  .pt-row .tag{
    display:inline-flex; align-items:center; gap:6px; font-weight:700;
  }
  .pt-row .dot{width:8px;height:8px;border-radius:50%;}
  .pt-row .dot.in{background:var(--in-color);}
  .pt-row .dot.mt{background:var(--mt-color); border-radius:2px;}
  .pt-row .h{color:var(--ink-soft); font-size:11px;}

  #detail{
    margin-top:16px; border:1.5px solid var(--ink); background:#fff;
    padding:12px; font-size:12px; display:none;
  }
  #detail.show{display:block;}
  #detail .dname{font-size:15px; font-weight:900; margin-bottom:6px;}
  #detail .drow{display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px dashed var(--panel-border);}
  #detail .drow span:first-child{color:var(--ink-soft);}

  .hint{
    position:absolute; left:16px; bottom:14px; z-index:20;
    font-size:11px; color:var(--ink-soft); background:rgba(246,244,238,.85);
    padding:6px 10px; border:1px solid var(--panel-border);
  }
  .scalebar{
    position:absolute; right:296px; bottom:14px; z-index:20;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    background:rgba(246,244,238,.85); padding:6px 10px; border:1px solid var(--panel-border);
  }
  .scalebar .bar{height:4px; background:var(--ink);}
  .scalebar .lbl{font-size:10px; font-family:'JetBrains Mono',monospace;}
  .northarrow{
    position:absolute; right:296px; top:14px; z-index:20;
    background:rgba(246,244,238,.85); border:1px solid var(--panel-border);
    padding:8px 10px; text-align:center; font-size:10px; font-weight:700;
  }
  .zoomctl{
    position:absolute; left:16px; top:14px; z-index:20;
    display:flex; flex-direction:column; border:1.5px solid var(--ink); background:var(--panel-bg);
  }
  .zoomctl button{
    width:32px; height:32px; border:none; background:transparent; font-size:16px; cursor:pointer;
    border-bottom:1px solid var(--panel-border); color:var(--ink); font-weight:700;
  }
  .zoomctl button:last-child{border-bottom:none;}
  .zoomctl button:hover{background:var(--accent); color:#fff;}

  @media (max-width:820px){
    aside{position:fixed; right:0; top:var(--header-h); bottom:0; transform:translateX(100%); transition:transform .25s; box-shadow:-4px 0 14px rgba(0,0,0,.15); z-index:60;}
    aside.open{transform:translateX(0);}
    #mapview{right:0;}
    .mobile-toggle{
      position:fixed; right:14px; z-index:70;
      top:calc(var(--header-h) + 10px);
      border:1.5px solid var(--ink); background:var(--ink); color:var(--paper);
      padding:8px 12px; font-size:12px; font-weight:700; cursor:pointer;
    }
    .scalebar,.northarrow{right:14px;}
    header{padding:8px 10px;}
    .title-block .eyebrow{display:none;}
    .title-block h1{font-size:13px;}
    .meta{display:none;}
    .view-toggle button{padding:7px 10px; font-size:11px;}
    .print-btn{padding:7px 10px; font-size:11px;}
    .basemap-switch{top:14px; left:10px; font-size:10.5px;}
    .basemap-switch button{padding:6px 9px;}
    .geoctl{left:10px; bottom:60px;}
    .geoinfo{left:10px; min-width:150px; bottom:110px;}
    .target-banner{
      top:auto; bottom:14px; left:10px; right:10px; width:auto; margin:0;
      justify-content:center; font-size:11.5px; padding:7px 8px 7px 12px;
    }
    .target-banner span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  }

  @media print{
    header .print-btn, .hint, .zoomctl, .mobile-toggle{display:none;}
    aside{position:static; width:220px; transform:none; box-shadow:none;}
    main{position:static;}
    body{overflow:visible;}
  }
</style>
</head>
<body>

<header>
  <div class="title-block">
    <span class="eyebrow">配置図　CONTROL POINT LAYOUT</span>
    <h1>国道212号　流木対策工　４級基準点</h1>
  </div>
  <div class="meta">
    <div class="item"><span class="k">座標系</span><span class="v mono">平面直角座標系 系II</span></div>
    <div class="item"><span class="k">点数</span><span class="v mono">14 点</span></div>
    <div class="item"><span class="k">出典</span><span class="v mono">国道212号_４級基準点座標.sim</span></div>
  </div>
  <div class="view-toggle">
    <button id="viewSchematic" class="active">配置図</button>
    <button id="viewMap">地図</button>
  </div>
  <button class="report-btn" onclick="openReport()">📷 確認記録</button>
  <button class="print-btn" onclick="window.print()">印刷 / PDF出力</button>
</header>

<button class="mobile-toggle" id="mobileToggle" style="display:none;">点一覧 ▸</button>

<main>
  <div class="target-banner" id="targetBanner" style="display:none;">
    <span id="targetBannerText">🎯 目的地: —</span>
    <button id="targetBannerClear" title="解除">✕</button>
  </div>

  <div id="stage">
    <svg id="svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet"></svg>

    <div class="zoomctl">
      <button id="zoomIn">＋</button>
      <button id="zoomOut">－</button>
      <button id="zoomReset">⟲</button>
    </div>

    <div class="northarrow">
      <svg width="26" height="34" viewBox="0 0 26 34">
        <polygon points="13,0 20,22 13,17 6,22" fill="#1f2a24"/>
        <text x="13" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2a24">N</text>
      </svg>
    </div>

    <div class="scalebar">
      <div class="bar" id="scaleBarPx" style="width:80px;"></div>
      <div class="lbl" id="scaleBarLbl">20 m</div>
    </div>

    <div class="hint">ドラッグ：移動　／　ホイール：拡大縮小　／　点クリック：詳細表示</div>
  </div>

  <div id="mapview">
    <div id="leafletMap" style="position:absolute; inset:0;"></div>
    <div class="basemap-switch" id="basemapSwitch">
      <button data-map="pale" class="active">淡色地図</button>
      <button data-map="std">標準地図</button>
      <button data-map="photo">航空写真</button>
    </div>

    <div class="geoinfo" id="geoInfo" style="display:none;">
      <div class="glabel">現在地 CURRENT LOCATION</div>
      <div class="gcoord mono" id="geoCoord">—</div>
      <div id="geoDefault">
        <div class="gnearest" id="geoNearest">—</div>
      </div>
      <div id="geoNav" style="display:none;">
        <div class="gnav-target" id="geoNavTarget">目的地: —</div>
        <div class="gnav-row">
          <svg id="geoArrow" width="30" height="30" viewBox="0 0 30 30">
            <polygon points="15,2 22,24 15,19 8,24" fill="#1a73e8"/>
          </svg>
          <div>
            <div class="gnav-dist" id="geoNavDist">— m</div>
            <div class="gnav-bearing" id="geoNavBearing">—</div>
          </div>
        </div>
        <button class="gnav-clear" id="geoNavClear">案内を解除</button>
      </div>
    </div>
    <div class="geoctl">
      <button id="geoToggle">📍 現在地表示</button>
    </div>
  </div>

  <aside id="aside">
    <h2>凡例 LEGEND</h2>
    <div class="legend-row" data-layer="IN">
      <input type="checkbox" checked data-layer-cb="IN"><span class="swatch in"></span>
      <span>IN　中心線基準点（5点）</span>
    </div>
    <div class="legend-row" data-layer="MT">
      <input type="checkbox" checked data-layer-cb="MT"><span class="swatch mt"></span>
      <span>MT　多角点／閉合トラバース（9点）</span>
    </div>

    <h2 style="margin-top:18px;">点一覧 POINT LIST</h2>
    <div class="pt-list" id="ptList"></div>

    <div id="detail"></div>
  </aside>
</main>

<input type="file" id="photoFileInput" accept="image/*" capture="environment" style="display:none;">

<div id="reportView">
  <div class="report-header">
    <h2>現地確認記録　国道212号　流木対策工　４級基準点</h2>
    <div class="report-actions">
      <button onclick="window.print()">🖨 印刷 / PDF出力</button>
      <button onclick="downloadPhotosZip()">📦 写真を一括DL(ZIP)</button>
      <button onclick="closeReport()">✕ 閉じる</button>
    </div>
  </div>
  <div id="reportBody"><p>読み込み中…</p></div>
</div>

<script>
/* ---------- source data (from SIMA A01 records) ---------- */
const RAW = [
  {num:"11", name:"IN-17", x:42746.006, y:2756.881, h:null,    lat:33.3854540, lon:131.0296326},
  {num:"12", name:"IN-18", x:42706.633, y:2726.477, h:297.109, lat:33.3850990, lon:131.0293057},

/* Transform: EPSG:6670 (JGD2011 / Japan Plane Rectangular CS II, origin 33N 131E) -> EPSG:4326.
   Verified against user-supplied reference point near 33.3797N 131.0263E (~500m from network, consistent with route corridor). */
RAW.forEach(p => p.type = p.name.startsWith("IN") ? "IN" : "MT");

const inSeq = RAW.filter(p=>p.type==="IN");                 // route reference line, in order
const mtSeq = RAW.filter(p=>p.type==="MT");                 // closed traverse loop

/* ---------- plane coordinate transform ----------
   Japanese public survey convention: X = North(+), Y = East(+).
   Screen: sx = Y (east→right), sy = -X (north→up)             */
const xs = RAW.map(p=>p.x), ys = RAW.map(p=>p.y);
const xMin=Math.min(...xs), xMax=Math.max(...xs);
const yMin=Math.min(...ys), yMax=Math.max(...ys);
const PAD = 22; // meters of padding around the data
const worldMinX = yMin - PAD, worldMaxX = yMax + PAD;      // screen-x from Y
const worldMinY = -(xMax) - PAD, worldMaxY = -(xMin) + PAD; // screen-y from -X
const worldW = worldMaxX - worldMinX, worldH = worldMaxY - worldMinY;

function toScreen(p){
  return { sx: p.y - worldMinX, sy: -p.x - worldMinY };
}
RAW.forEach(p => { const s = toScreen(p); p.sx = s.sx; p.sy = s.sy; });

function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

/* ---------- build SVG ---------- */
const svg = document.getElementById('svg');
const VB_W = 1000, VB_H = 1000 * (worldH/worldW);
svg.setAttribute('viewBox', `0 0 ${1000} ${VB_H.toFixed(2)}`);
const scale = 1000 / worldW; // px per meter (in viewBox units)

function px(v){ return (v*scale).toFixed(2); }

function el(tag, attrs, parent){
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  (parent||svg).appendChild(e);
  return e;
}

/* graticule labels at nice 20m intervals, in world (screen) space */
const gLayer = el('g',{id:'graticule'});
const step = 20;
for(let gx = Math.ceil(worldMinX/step)*step; gx <= worldMaxX; gx += step){
  el('line',{x1:px(gx-worldMinX),y1:0,x2:px(gx-worldMinX),y2:px(worldH),stroke:'#dcd6c4','stroke-width':1}, gLayer);
}
for(let gy = Math.ceil(worldMinY/step)*step; gy <= worldMaxY; gy += step){
  el('line',{x1:0,y1:px(gy-worldMinY),x2:px(worldW),y2:px(gy-worldMinY),stroke:'#dcd6c4','stroke-width':1}, gLayer);
}

/* route line (IN sequence) */
const inLayer = el('g',{id:'layer-IN'});
let inPath = "M " + inSeq.map(p=>`${px(p.sx)},${px(p.sy)}`).join(" L ");
el('path',{d:inPath, fill:'none', stroke:'var(--in-color)', 'stroke-width':2.4, 'stroke-dasharray':'10 6'}, inLayer);
for(let i=0;i<inSeq.length-1;i++){
  const a=inSeq[i], b=inSeq[i+1];
  const mx=(a.sx+b.sx)/2, my=(a.sy+b.sy)/2;
  el('text',{x:px(mx),y:px(my)-6,'text-anchor':'middle',class:'mono','font-size':11,fill:'var(--in-color)','font-weight':700},inLayer).textContent = dist(a,b).toFixed(2)+"m";
}

/* traverse loop (MT sequence, closed) */
const mtLayer = el('g',{id:'layer-MT'});
let mtPath = "M " + mtSeq.map(p=>`${px(p.sx)},${px(p.sy)}`).join(" L ") + " Z";
el('path',{d:mtPath, fill:'rgba(31,95,107,0.06)', stroke:'var(--mt-color)', 'stroke-width':2}, mtLayer);
for(let i=0;i<mtSeq.length;i++){
  const a=mtSeq[i], b=mtSeq[(i+1)%mtSeq.length];
  const mx=(a.sx+b.sx)/2, my=(a.sy+b.sy)/2;
  el('text',{x:px(mx),y:px(my)-6,'text-anchor':'middle',class:'mono','font-size':10,fill:'var(--mt-color)','font-weight':700},mtLayer).textContent = dist(a,b).toFixed(2)+"m";
}

/* point markers */
const ptLayer = el('g',{id:'points'});
const markerR = 6.5;
RAW.forEach(p=>{
  const g = el('g',{class:'pt', 'data-num':p.num, style:'cursor:pointer;'}, ptLayer);
  if(p.type==="IN"){
    const cx=parseFloat(px(p.sx)), cy=parseFloat(px(p.sy)), r=markerR;
    const pts = [
      [cx, cy-r*1.15],
      [cx-r, cy+r*0.75],
      [cx+r, cy+r*0.75]
    ].map(pt=>pt.join(",")).join(" ");
    el('polygon',{points:pts, fill:'var(--in-color)', stroke:'#fff', 'stroke-width':1.5}, g);
  } else {
    el('rect',{x:px(p.sx)-markerR,y:px(p.sy)-markerR,width:markerR*2,height:markerR*2,fill:'var(--mt-color)',stroke:'#fff','stroke-width':1.5,rx:2}, g);
  }
  el('text',{x:px(p.sx), y:px(p.sy)-markerR-5, 'text-anchor':'middle', 'font-size':12, 'font-weight':700, fill:'var(--ink)', class:'mono'}, g).textContent = p.name;
});

/* ---------- pan / zoom ---------- */
const stage = document.getElementById('stage');
let vb = {x:0, y:0, w:1000, h:VB_H};
const vb0 = {...vb};
function applyVB(){ svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
applyVB();

let isPan=false, panStart={x:0,y:0}, vbStart={x:0,y:0};
stage.addEventListener('mousedown', e=>{
  if(e.target.closest('.pt')) return;
  isPan=true; stage.classList.add('grabbing');
  panStart={x:e.clientX,y:e.clientY}; vbStart={x:vb.x,y:vb.y};
});
window.addEventListener('mouseup', ()=>{ isPan=false; stage.classList.remove('grabbing'); });
window.addEventListener('mousemove', e=>{
  if(!isPan) return;
  const rect = stage.getBoundingClientRect();
  const scaleX = vb.w/rect.width, scaleY = vb.h/rect.height;
  vb.x = vbStart.x - (e.clientX-panStart.x)*scaleX;
  vb.y = vbStart.y - (e.clientY-panStart.y)*scaleY;
  applyVB();
});
stage.addEventListener('wheel', e=>{
  e.preventDefault();
  const rect = stage.getBoundingClientRect();
  const mx = (e.clientX-rect.left)/rect.width, my=(e.clientY-rect.top)/rect.height;
  const wx = vb.x + mx*vb.w, wy = vb.y + my*vb.h;
  const factor = e.deltaY>0 ? 1.12 : 0.89;
  vb.w = Math.max(60, Math.min(4000, vb.w*factor));
  vb.h = vb.w * (VB_H/1000);
  vb.x = wx - mx*vb.w;
  vb.y = wy - my*vb.h;
  applyVB();
  updateScaleBar();
},{passive:false});

/* touch: single-finger pan, two-finger pinch-zoom */
let touchMode = null; // 'pan' | 'pinch'
let touchPanStart={x:0,y:0}, touchVbStart={x:0,y:0};
let pinchStartDist=0, pinchStartVb=null, pinchMid={x:0,y:0};

function touchDist(t0,t1){ return Math.hypot(t1.clientX-t0.clientX, t1.clientY-t0.clientY); }

stage.addEventListener('touchstart', e=>{
  if(e.target.closest('.pt')) return;
  if(e.touches.length===1){
    touchMode='pan';
    touchPanStart={x:e.touches[0].clientX, y:e.touches[0].clientY};
    touchVbStart={x:vb.x, y:vb.y};
  } else if(e.touches.length===2){
    touchMode='pinch';
    pinchStartDist = touchDist(e.touches[0], e.touches[1]);
    pinchStartVb = {...vb};
    const rect = stage.getBoundingClientRect();
    pinchMid = {
      x: ((e.touches[0].clientX+e.touches[1].clientX)/2 - rect.left)/rect.width,
      y: ((e.touches[0].clientY+e.touches[1].clientY)/2 - rect.top)/rect.height
    };
  }
},{passive:false});

stage.addEventListener('touchmove', e=>{
  if(touchMode==='pan' && e.touches.length===1){
    e.preventDefault();
    const rect = stage.getBoundingClientRect();
    const scaleX = vb.w/rect.width, scaleY = vb.h/rect.height;
    vb.x = touchVbStart.x - (e.touches[0].clientX-touchPanStart.x)*scaleX;
    vb.y = touchVbStart.y - (e.touches[0].clientY-touchPanStart.y)*scaleY;
    applyVB();
  } else if(touchMode==='pinch' && e.touches.length===2){
    e.preventDefault();
    const dist = touchDist(e.touches[0], e.touches[1]);
    const factor = pinchStartDist / Math.max(1,dist);
    const wx = pinchStartVb.x + pinchMid.x*pinchStartVb.w;
    const wy = pinchStartVb.y + pinchMid.y*pinchStartVb.h;
    vb.w = Math.max(60, Math.min(4000, pinchStartVb.w*factor));
    vb.h = vb.w * (VB_H/1000);
    vb.x = wx - pinchMid.x*vb.w;
    vb.y = wy - pinchMid.y*vb.h;
    applyVB();
    updateScaleBar();
  }
},{passive:false});

stage.addEventListener('touchend', e=>{
  if(e.touches.length===0) touchMode=null;
  else if(e.touches.length===1){
    touchMode='pan';
    touchPanStart={x:e.touches[0].clientX, y:e.touches[0].clientY};
    touchVbStart={x:vb.x, y:vb.y};
  }
});

document.getElementById('zoomIn').onclick = ()=>{ centerZoom(0.8); };
document.getElementById('zoomOut').onclick = ()=>{ centerZoom(1.25); };
document.getElementById('zoomReset').onclick = ()=>{ vb={...vb0}; applyVB(); updateScaleBar(); };
function centerZoom(factor){
  const cx = vb.x+vb.w/2, cy = vb.y+vb.h/2;
  vb.w = Math.max(60, Math.min(4000, vb.w*factor));
  vb.h = vb.w*(VB_H/1000);
  vb.x = cx-vb.w/2; vb.y = cy-vb.h/2;
  applyVB(); updateScaleBar();
}

function updateScaleBar(){
  const rect = stage.getBoundingClientRect();
  const metersPerPx = (vb.w/scale)/rect.width;
  let targetM = 20;
  const candidates=[2,5,10,20,50,100,200];
  let best=candidates[0], bestDiff=Infinity;
  candidates.forEach(c=>{ const px=c/metersPerPx; const diff=Math.abs(px-90); if(diff<bestDiff){bestDiff=diff; best=c;} });
  const barPx = best/metersPerPx;
  document.getElementById('scaleBarPx').style.width = barPx+"px";
  document.getElementById('scaleBarLbl').textContent = best+" m";
}
setTimeout(updateScaleBar, 50);

function haversine(lat1, lon1, lat2, lon2){
  const R = 6371000, toRad = d => d*Math.PI/180;
  const dLat = toRad(lat2-lat1), dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

function bearing(lat1, lon1, lat2, lon2){
  const toRad = d=>d*Math.PI/180, toDeg = r=>r*180/Math.PI;
  const phi1=toRad(lat1), phi2=toRad(lat2), dLambda=toRad(lon2-lon1);
  const y = Math.sin(dLambda)*Math.cos(phi2);
  const x = Math.cos(phi1)*Math.sin(phi2) - Math.sin(phi1)*Math.cos(phi2)*Math.cos(dLambda);
  return (toDeg(Math.atan2(y,x))+360)%360;
}
function bearingLabel(deg){
  const dirs = ['北','北北東','北東','東北東','東','東南東','南東','南南東','南','南南西','南西','西南西','西','西北西','北西','北北西'];
  return dirs[Math.round(deg/22.5)%16];
}

  if(targetRing && leafletMap){ leafletMap.removeLayer(targetRing); targetRing=null; }
}

/* target ring on the schematic (配置図) SVG view */
let schematicRing = null;

  }, ptLayer);

function hideSchematicRing(){

function updateGeoDisplay(lat, lon, accuracy){
  geoCoordEl.textContent = `${lat.toFixed(6)}, ${lon.toFixed(6)} (±${accuracy.toFixed(0)}m)`;
  if(navTarget){
    geoDefaultEl.style.display = 'none';
    geoNavEl.style.display = 'block';
    const d = haversine(lat, lon, navTarget.lat, navTarget.lon);
    const b = bearing(lat, lon, navTarget.lat, navTarget.lon);
    geoNavTargetEl.textContent = `目的地: ${navTarget.name}`;
    geoNavDistEl.textContent = d<1000 ? `${d.toFixed(1)} m` : `${(d/1000).toFixed(2)} km`;
    geoNavBearingEl.textContent = `${bearingLabel(b)}（北から ${b.toFixed(0)}°）`;
    geoArrowEl.style.transform = `rotate(${b}deg)`;
  } else {
    geoDefaultEl.style.display = 'block';
    geoNavEl.style.display = 'none';
    let nearest=null, nearestD=Infinity;
    RAW.forEach(p=>{
      const dd = haversine(lat, lon, p.lat, p.lon);
      if(dd<nearestD){ nearestD=dd; nearest=p; }
    });
    if(nearest){
      if(nearestD > OUT_OF_RANGE_THRESHOLD_M){
        geoNearestEl.textContent = `⚠ 範囲外です（最寄り: ${nearest.name}　約 ${nearestD.toFixed(0)} m）`;
        geoNearestEl.style.color = 'var(--in-color)';
      } else {
        geoNearestEl.textContent = `最寄り基準点: ${nearest.name}（約 ${nearestD.toFixed(1)} m）`;
        geoNearestEl.style.color = 'var(--accent)';
      }
    }
  }
}

function startGeo(){
  if(!('geolocation' in navigator)){
    alert('この端末・ブラウザは位置情報の取得に対応していません。');
    return;
  }
  if(!window.isSecureContext){
    alert('位置情報の取得には HTTPS で配信されたページを開く必要があります。\nこのファイルを直接開いている場合（file://…）は動作しません。GitHub Pages 等でHTTPS公開したURLからアクセスしてください。');
    return;
  }
  geoToggleBtn.classList.add('active');
  geoToggleBtn.textContent = '📍 現在地表示 停止';
  geoInfoEl.style.display = 'block';
  geoCoordEl.textContent = '取得中…';
  geoNearestEl.textContent = '';
  geoNearestEl.style.color = '';
  geoWatchId = navigator.geolocation.watchPosition(onGeoSuccess, onGeoError, {
    enableHighAccuracy:true, maximumAge:2000, timeout:15000
  });
}

function stopGeo(){
  if(geoWatchId!==null){ navigator.geolocation.clearWatch(geoWatchId); geoWatchId=null; }
  geoToggleBtn.classList.remove('active');
  geoToggleBtn.textContent = '📍 現在地表示';
  geoInfoEl.style.display = 'none';
  if(geoMarker){ leafletMap.removeLayer(geoMarker); geoMarker=null; }
  if(geoAccuracyCircle){ leafletMap.removeLayer(geoAccuracyCircle); geoAccuracyCircle=null; }
}

function onGeoSuccess(pos){
  const {latitude, longitude, accuracy} = pos.coords;
  if(!geoMarker){
    const dotIcon = L.divIcon({
      html:'<div style="width:16px;height:16px;background:#1a73e8;border:3px solid #fff;border-radius:50%;box-shadow:0 0 5px rgba(0,0,0,.45)"></div>',
      className:'', iconSize:[16,16], iconAnchor:[8,8]
    });
    geoMarker = L.marker([latitude,longitude], {icon:dotIcon, zIndexOffset:1000}).addTo(leafletMap);
    leafletMap.setView([latitude,longitude], 19);
  } else {
    geoMarker.setLatLng([latitude,longitude]);
  }
  if(!geoAccuracyCircle){
    geoAccuracyCircle = L.circle([latitude,longitude], {radius:accuracy, color:'#1a73e8', weight:1, fillOpacity:0.08}).addTo(leafletMap);
  } else {
    geoAccuracyCircle.setLatLng([latitude,longitude]);
    geoAccuracyCircle.setRadius(accuracy);
  }
  lastLat = latitude; lastLon = longitude; lastAccuracy = accuracy;
  updateGeoDisplay(latitude, longitude, accuracy);
}

function onGeoError(err){
  let msg = '位置情報を取得できませんでした。';
  if(err.code===1) msg = '位置情報の利用が許可されていません。ブラウザの設定から許可してください。';
  else if(err.code===2) msg = '位置情報を取得できません（電波状況等をご確認ください）。';
  else if(err.code===3) msg = '位置情報の取得がタイムアウトしました。もう一度お試しください。';
  geoCoordEl.textContent = msg;
}

geoToggleBtn.addEventListener('click', ()=>{
  if(geoWatchId===null) startGeo(); else stopGeo();
});

/* ---------- 現地確認写真（遠景・近景）: IndexedDB保存 ---------- */
const PHOTO_DB_NAME = 'kijuntenPhotoDB';
const PHOTO_STORE = 'photos';
let photoDbPromise = null;
function openPhotoDB(){
  if(photoDbPromise) return photoDbPromise;
  photoDbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open(PHOTO_DB_NAME, 1);
    req.onupgradeneeded = e=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains(PHOTO_STORE)){
        db.createObjectStore(PHOTO_STORE, {keyPath:'key'});
      }
    };
    req.onsuccess = e=> resolve(e.target.result);
    req.onerror = e=> reject(e.target.error);
  });
  return photoDbPromise;
}
function savePhotoBlob(num, kind, blob){
  return openPhotoDB().then(db=> new Promise((resolve,reject)=>{
    const tx = db.transaction(PHOTO_STORE,'readwrite');
    tx.objectStore(PHOTO_STORE).put({key:`${num}_${kind}`, num, kind, blob, ts:Date.now()});
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  }));
}
function getPhotoBlob(num, kind){
  return openPhotoDB().then(db=> new Promise((resolve,reject)=>{
    const tx = db.transaction(PHOTO_STORE,'readonly');
    const req = tx.objectStore(PHOTO_STORE).get(`${num}_${kind}`);
    req.onsuccess = ()=> resolve(req.result || null);
    req.onerror = ()=> reject(req.error);
  }));
}
function deletePhotoBlob(num, kind){
  return openPhotoDB().then(db=> new Promise((resolve,reject)=>{
    const tx = db.transaction(PHOTO_STORE,'readwrite');
    tx.objectStore(PHOTO_STORE).delete(`${num}_${kind}`);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  }));
}
function getAllPhotoRecords(){
  return openPhotoDB().then(db=> new Promise((resolve,reject)=>{
    const tx = db.transaction(PHOTO_STORE,'readonly');
    const req = tx.objectStore(PHOTO_STORE).getAll();
    req.onsuccess = ()=> resolve(req.result || []);
    req.onerror = ()=> reject(req.error);
  }));
}

let photoStatus = {}; // { num: {enkei:bool, kinkei:bool} }
let pendingPhotoTarget = null;

function photoBadgeHTML(num){
  const st = photoStatus[num] || {enkei:false, kinkei:false};
  if(st.enkei && st.kinkei) return '✅';
  if(st.enkei || st.kinkei) return '📷';
  return '';
}
function updatePhotoBadge(num){
  const el = document.getElementById('pbadge-'+num);
  if(el) el.textContent = photoBadgeHTML(num);
}
function initPhotoStatus(){
  getAllPhotoRecords().then(all=>{
    all.forEach(rec=>{
      if(!photoStatus[rec.num]) photoStatus[rec.num] = {enkei:false, kinkei:false};
      photoStatus[rec.num][rec.kind] = true;
    });
    RAW.forEach(p=> updatePhotoBadge(p.num));
  });
}
initPhotoStatus();

function renderPhotoSection(num){
  return `
    <div class="photo-section">
      <div class="photo-slot">
        <div class="photo-label">遠景</div>
        <div class="photo-thumb" id="thumb-${num}-enkei"><span class="photo-empty">未撮影</span></div>
        <div class="photo-actions">
          <button class="photo-btn" data-num="${num}" data-kind="enkei">📷 撮影/選択</button>
          <button class="photo-del" data-num="${num}" data-kind="enkei">✕</button>
        </div>
      </div>
      <div class="photo-slot">
        <div class="photo-label">近景</div>
        <div class="photo-thumb" id="thumb-${num}-kinkei"><span class="photo-empty">未撮影</span></div>
        <div class="photo-actions">
          <button class="photo-btn" data-num="${num}" data-kind="kinkei">📷 撮影/選択</button>
          <button class="photo-del" data-num="${num}" data-kind="kinkei">✕</button>
        </div>
      </div>
    </div>
  `;
}
function loadPhotoThumbnails(num){
  ['enkei','kinkei'].forEach(kind=>{
    getPhotoBlob(num, kind).then(rec=>{
      const el = document.getElementById(`thumb-${num}-${kind}`);
      if(!el) return;
      if(rec && rec.blob){
        const url = URL.createObjectURL(rec.blob);
        el.innerHTML = `<img src="${url}" alt="${kind}">`;
      } else {
        el.innerHTML = `<span class="photo-empty">未撮影</span>`;
      }
    });
  });
}
document.getElementById('photoFileInput').addEventListener('change', e=>{
  const file = e.target.files[0];
  e.target.value = '';
  if(!file || !pendingPhotoTarget) return;
  const {num, kind} = pendingPhotoTarget;
  savePhotoBlob(num, kind, file).then(()=>{
    if(!photoStatus[num]) photoStatus[num] = {enkei:false, kinkei:false};
    photoStatus[num][kind] = true;
    updatePhotoBadge(num);
    const activeRow = document.querySelector('.pt-row.active');
    if(activeRow && activeRow.dataset.num===num) selectPoint(num, false);
  });
});

/* ---------- 現地確認記録レポート（印刷/PDF・ZIP一括DL） ---------- */
function getExt(blob){
  if(blob && blob.name){
    const m = blob.name.match(/\.[a-zA-Z0-9]+$/);
    if(m) return m[0];
  }
  if(blob && blob.type){
    if(blob.type.includes('png')) return '.png';
    if(blob.type.includes('webp')) return '.webp';
  }
  return '.jpg';
}
async function openReport(){
  const view = document.getElementById('reportView');
  const body = document.getElementById('reportBody');
  view.classList.add('open');
  body.innerHTML = '<p>読み込み中…</p>';
  let doneCount = 0;
  const cardsHtml = [];
  for(const p of RAW){
    const enkei = await getPhotoBlob(p.num,'enkei');
    const kinkei = await getPhotoBlob(p.num,'kinkei');
    if(enkei && kinkei) doneCount++;
    const enkeiHtml = enkei ? `<img src="${URL.createObjectURL(enkei.blob)}">` : `<div class="rmissing">未撮影</div>`;
    const kinkeiHtml = kinkei ? `<img src="${URL.createObjectURL(kinkei.blob)}">` : `<div class="rmissing">未撮影</div>`;
    cardsHtml.push(`
      <div class="report-card">
        <div class="report-card-head">
          <span class="rname">${p.name}</span>
          <span class="rmeta">点番 ${p.num}　${p.type==='IN'?'中心線基準点':'多角点(トラバース)'}</span>
        </div>
        <div class="report-coords">X: ${p.x.toFixed(3)}　Y: ${p.y.toFixed(3)}　H: ${p.h!==null?p.h.toFixed(3)+'m':'未記載'}　緯度経度: ${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}</div>
        <div class="report-photos">
          <div class="report-photo"><div class="rlabel">遠景</div>${enkeiHtml}</div>
          <div class="report-photo"><div class="rlabel">近景</div>${kinkeiHtml}</div>
        </div>
      </div>
    `);
  }
  body.innerHTML = `<p class="report-progress">確認済み: ${doneCount} / ${RAW.length} 点</p>` + cardsHtml.join('');
}
function closeReport(){
  document.getElementById('reportView').classList.remove('open');
}
async function downloadPhotosZip(){
  const zip = new JSZip();
  let count = 0;
  for(const p of RAW){
    const enkei = await getPhotoBlob(p.num,'enkei');
    const kinkei = await getPhotoBlob(p.num,'kinkei');
    if(enkei){ zip.file(`${p.name}_遠景${getExt(enkei.blob)}`, enkei.blob); count++; }
    if(kinkei){ zip.file(`${p.name}_近景${getExt(kinkei.blob)}`, kinkei.blob); count++; }
  }
  if(count===0){ alert('保存されている写真がありません。'); return; }
  const blob = await zip.generateAsync({type:'blob'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `国道212号_基準点確認写真_${new Date().toISOString().slice(0,10)}.zip`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
