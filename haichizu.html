<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="写真配置図">
<title>災害調査 写真配置図</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#toolbar{display:flex;align-items:center;gap:5px;padding:7px 8px;background:#fff;border-bottom:1px solid #e5e5e0;flex-wrap:wrap;flex-shrink:0}
.tb-btn{display:flex;align-items:center;gap:4px;padding:7px 10px;border:1px solid #d0d0c8;border-radius:8px;background:#fff;cursor:pointer;font-size:12px;color:#333;white-space:nowrap;touch-action:manipulation}
.tb-btn:active{background:#f0f0ea}
.tb-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.tb-sel{padding:6px 6px;border:1px solid #d0d0c8;border-radius:8px;background:#fff;font-size:11px;color:#333;max-width:120px}
.tb-sep{width:1px;height:20px;background:#e0e0d8;flex-shrink:0}
.mode-on{background:#E6F1FB!important;border-color:#185FA5!important;color:#185FA5!important}
#main{display:flex;flex:1;min-height:0;position:relative}
#map-wrap{flex:1;min-width:0;position:relative;overflow:hidden}
#map{position:absolute;top:0;left:0;width:100%;height:100%}

/* サイドパネル */
#side{width:130px;border-left:1px solid #e5e5e0;background:#fff;display:flex;flex-direction:column;z-index:2;flex-shrink:0}
#side-hd{padding:6px 8px;font-size:10px;font-weight:600;color:#888;border-bottom:1px solid #e5e5e0;display:flex;align-items:center;justify-content:space-between}
#btn-clear{font-size:9px;padding:2px 5px;border:1px solid #f5c6cb;border-radius:4px;color:#c0392b;background:#fff;cursor:pointer}
#photo-list{flex:1;overflow-y:auto;padding:4px;-webkit-overflow-scrolling:touch}

/* ペアアイテム */
.pair-item{border:1px solid #e0e0d8;border-radius:8px;margin-bottom:6px;overflow:hidden;background:#fafaf8}
.pair-hd{display:flex;align-items:center;justify-content:space-between;padding:4px 6px;background:#f0f0ea;font-size:10px;font-weight:600;color:#555;cursor:pointer}
.pair-hd .pair-no{background:#E24B4A;color:#fff;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0}
.pair-hd .pair-latlng{font-size:8px;color:#999;margin-left:4px;flex:1}
.pair-hd .pair-del{background:none;border:none;color:#c0392b;font-size:11px;cursor:pointer;padding:0 2px}
.pair-body{display:flex;gap:3px;padding:4px}
.pair-slot{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.pair-slot-lbl{font-size:8px;font-weight:600;padding:1px 4px;border-radius:3px;text-align:center}
.lbl-en{background:#E3F0FF;color:#185FA5}
.lbl-kn{background:#E3F5E8;color:#1D7A3A}
.pair-thumb{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;display:block;cursor:pointer}
.pair-add{width:100%;aspect-ratio:4/3;border:1.5px dashed #ccc;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#ccc;cursor:pointer;background:#fff}
.pair-add:active{background:#f5f5f0}
.pair-item.active-pair{border-color:#185FA5;box-shadow:0 0 0 2px #185FA533}

#statusbar{padding:4px 10px;font-size:11px;color:#666;background:#f5f5f0;border-top:1px solid #e5e5e0;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#empty-hint{padding:12px 6px;font-size:10px;color:#aaa;text-align:center;line-height:1.9}

/* Leafletマーカー */
.ph-mw{background:#fff;border:2px solid #378ADD;border-radius:6px;padding:2px;box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer;position:relative}
.ph-mw .pair-imgs{display:flex;gap:2px}
.ph-mw .pair-imgs img{display:block;border-radius:2px;object-fit:cover}
.ph-mw .ph-ml{font-size:8px;text-align:center;background:rgba(0,0,0,.65);color:#fff;padding:1px 3px;border-radius:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.ph-mn{position:absolute;top:-8px;left:-8px;width:18px;height:18px;background:#E24B4A;color:#fff;border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;line-height:1;z-index:1}

/* 写真追加モーダル */
#add-modal,#save-modal,#photo-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:8000;align-items:flex-end;justify-content:center}
#add-modal.open,#save-modal.open{display:flex}
#photo-modal{background:rgba(0,0,0,.88);align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:9000}
#photo-modal.open{display:flex}
.sheet{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:500px;padding:20px 16px 32px;display:flex;flex-direction:column;gap:10px}
.sheet h3{font-size:15px;font-weight:600;color:#333;text-align:center}
.sheet-opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid #e0e0d8;border-radius:12px;cursor:pointer;font-size:14px;color:#333;background:#fff;width:100%;text-align:left;font-family:inherit;touch-action:manipulation}
.sheet-opt:active{background:#f5f5f0}
.sheet-opt svg{width:22px;height:22px;stroke:#378ADD;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sheet-sub{font-size:11px;color:#888;display:block;margin-top:2px}
.sheet-cancel{background:none;border:none;color:#888;font-size:14px;padding:8px;cursor:pointer;width:100%;font-family:inherit}

/* ペアポップアップ（地図上） */
.leaflet-popup-content-wrapper{border-radius:12px!important;padding:0!important;overflow:hidden}
.leaflet-popup-content{margin:0!important}
.pair-popup{background:#fff;min-width:200px}
.pair-popup-hd{padding:8px 12px;font-size:12px;font-weight:600;color:#333;border-bottom:1px solid #f0f0ea;display:flex;align-items:center;gap:6px}
.pair-popup-body{display:flex;gap:0}
.pair-popup-col{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px;gap:4px;cursor:pointer}
.pair-popup-col:first-child{border-right:1px solid #f0f0ea}
.pair-popup-col:active{background:#f5f5f5}
.pair-popup-col img{width:100%;max-width:120px;aspect-ratio:4/3;object-fit:cover;border-radius:4px;display:block}
.pair-popup-col-lbl{font-size:10px;font-weight:600;padding:2px 8px;border-radius:4px}
.pair-popup-col .empty-slot{width:100%;max-width:120px;aspect-ratio:4/3;border:2px dashed #ddd;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#bbb}

/* 拡大写真モーダル */
#photo-modal img{max-width:90vw;max-height:78vh;object-fit:contain;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
#photo-modal-name{color:#fff;font-size:13px;opacity:.9}
#photo-modal-close{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:8px 28px;font-size:14px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <select class="tb-sel" id="map-sel" onchange="changeLayer(this.value)">
      <option value="osm">🗺 OpenStreetMap</option>
      <option value="gsi">📍 地理院標準</option>
      <option value="gsip">🗾 地理院航空</option>
      <option value="gsil">📋 地理院淡色</option>
      <option value="gmap">🌐 Googleマップ</option>
      <option value="gsat">🛰 Google航空</option>
    </select>
    <div class="tb-sep"></div>
    <button class="tb-btn" onclick="openAddModal()">
      <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
      写真追加
    </button>
    <button class="tb-btn" id="btn-mode" onclick="toggleMode()">
      <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span id="mode-txt">配置モード</span>
    </button>
    <div class="tb-sep"></div>
    <button class="tb-btn" onclick="openSaveModal()">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      保存・提出
    </button>
    <button class="tb-btn" onclick="exportPrint()">
      <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      印刷
    </button>
  </div>
  <div id="main">
    <div id="map-wrap"><div id="map"></div></div>
    <div id="side">
      <div id="side-hd">
        <span>📍 箇所リスト</span>
        <button id="btn-clear" onclick="clearAll()">全削除</button>
      </div>
      <div id="photo-list"><div id="empty-hint">①写真追加<br>②配置モードON<br>③地図をタップ<br><br>同じ箇所の<br>遠景・近景を<br>ペアで管理</div></div>
    </div>
  </div>
  <div id="statusbar">地図を読み込み中...</div>
</div>

<!-- 写真追加モーダル -->
<div id="add-modal" onclick="if(event.target===this)closeAddModal()">
  <div class="sheet">
    <h3 id="add-modal-title">写真を追加</h3>
    <div id="add-modal-hint" style="font-size:12px;color:#888;text-align:center;margin:-4px 0 4px"></div>
    <button class="sheet-opt" onclick="triggerFile('camera')">
      <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
      <div><span>カメラで撮影</span><span class="sheet-sub">今すぐ撮影して追加</span></div>
    </button>
    <button class="sheet-opt" onclick="triggerFile('gallery')">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <div><span>ギャラリーから選択</span><span class="sheet-sub">保存済みの写真（複数可）</span></div>
    </button>
    <button class="sheet-cancel" onclick="closeAddModal()">キャンセル</button>
  </div>
</div>

<!-- 保存モーダル -->
<div id="save-modal" onclick="if(event.target===this)closeSaveModal()">
  <div class="sheet">
    <h3>保存・提出形式を選択</h3>
    <div style="font-size:12px;color:#666;text-align:center">配置済み箇所: <span id="save-count">0</span>箇所</div>
    <button class="sheet-opt" onclick="exportHTML()">
      <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
      <div><span>HTMLファイルで保存</span><span class="sheet-sub">写真埋め込み・オフラインで開ける・提出可</span></div>
    </button>
    <button class="sheet-opt" onclick="exportPrint();closeSaveModal()">
      <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      <div><span>PDF印刷・保存</span><span class="sheet-sub">現在の地図画面を印刷またはPDF出力</span></div>
    </button>
    <button class="sheet-cancel" onclick="closeSaveModal()">キャンセル</button>
  </div>
</div>

<!-- 写真拡大モーダル -->
<div id="photo-modal" onclick="closePhotoModal()">
  <img id="photo-modal-img" src="" alt="">
  <div id="photo-modal-name"></div>
  <button id="photo-modal-close" onclick="closePhotoModal()">閉じる</button>
</div>

<script>
const TILES={
  osm:{url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',attr:'© OpenStreetMap',max:19},
  gsi:{url:'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',attr:'© 国土地理院',max:18},
  gsip:{url:'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',attr:'© 国土地理院',max:18},
  gsil:{url:'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',attr:'© 国土地理院',max:18},
  gmap:{url:'https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',attr:'© Google',max:20},
  gsat:{url:'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',attr:'© Google',max:20},
};

const mapWrap=document.getElementById('map-wrap');
const mapEl=document.getElementById('map');
const map=L.map('map',{zoomControl:true}).setView([33.3206,130.8994],14);
let curLayer=L.tileLayer(TILES.osm.url,{attribution:TILES.osm.attr,maxZoom:19}).addTo(map);

function fixMapSize(){
  const w=mapWrap.offsetWidth,h=mapWrap.offsetHeight;
  if(w>0&&h>0){mapEl.style.width=w+'px';mapEl.style.height=h+'px';map.invalidateSize(true);}
}
function fixRep(){fixMapSize();[200,500,1000,2000].forEach(t=>setTimeout(fixMapSize,t));}

function changeLayer(k){
  const t=TILES[k];if(!t)return;
  map.removeLayer(curLayer);
  curLayer=L.tileLayer(t.url,{attribution:t.attr,maxZoom:t.max}).addTo(map);
  fixRep();
}

// ===== データ構造 =====
// pairs: [{id, num, latlng, marker, en:{url,file,name}, kn:{url,file,name}}]
const pairs=[];
let placeMode=false;
let activePairId=null; // 配置待ちのペアID
let addTarget=null;    // {pairId, slot:'en'|'kn'} 写真追加先

// ===== モーダル =====
function openAddModal(pairId=null, slot=null){
  addTarget = pairId ? {pairId, slot} : null;
  const title = pairId
    ? (slot==='en' ? '遠景写真を追加' : '近景写真を追加')
    : '新規箇所の写真を追加';
  const hint = pairId
    ? (slot==='en' ? '📷 遠景（引き画・全体がわかる写真）' : '📷 近景（損傷箇所のアップ写真）')
    : '最初の写真から箇所を追加します';
  document.getElementById('add-modal-title').textContent=title;
  document.getElementById('add-modal-hint').textContent=hint;
  document.getElementById('add-modal').classList.add('open');
}
function closeAddModal(){document.getElementById('add-modal').classList.remove('open');fixRep();}
function openSaveModal(){
  document.getElementById('save-count').textContent=pairs.filter(p=>p.latlng).length;
  document.getElementById('save-modal').classList.add('open');
}
function closeSaveModal(){document.getElementById('save-modal').classList.remove('open');}
function openPhotoModal(url, name){
  document.getElementById('photo-modal-img').src=url;
  document.getElementById('photo-modal-name').textContent=name;
  document.getElementById('photo-modal').classList.add('open');
}
function closePhotoModal(){document.getElementById('photo-modal').classList.remove('open');}

// ===== ファイル入力 =====
function triggerFile(type){
  closeAddModal();
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';inp.style.display='none';
  if(type==='camera')inp.capture='environment';
  else inp.multiple=true;
  inp.onchange=e=>{
    const files=Array.from(e.target.files);
    if(addTarget){
      // 既存ペアへの追加（遠景 or 近景）
      if(files.length>0) addPhotoToSlot(addTarget.pairId, addTarget.slot, files[0]);
    } else {
      // 新規ペアとして追加（複数枚 → 最初を遠景、次を近景として処理）
      files.forEach((f,i)=>{
        if(i===0) addNewPair(f);
        // 2枚目以降は最後のペアの近景へ
        else {
          const lastPair=pairs[pairs.length-1];
          if(lastPair && !lastPair.kn) addPhotoToSlot(lastPair.id,'kn',f);
          else addNewPair(f);
        }
      });
    }
    document.body.removeChild(inp);
    fixRep();
  };
  document.body.appendChild(inp);inp.click();
}

// ===== 新規ペア追加 =====
function addNewPair(file){
  const id='pair_'+Date.now()+'_'+Math.random().toString(36).slice(2,5);
  const num=pairs.length+1;
  const url=URL.createObjectURL(file);
  const name=file.name.replace(/\.[^.]+$/,'');
  const pair={id,num,latlng:null,marker:null,en:{url,file,name},kn:null};
  pairs.push(pair);
  if(!activePairId) activePairId=id;
  renderSide();
  // GPS読取
  readExifGPS(file).then(coords=>{
    if(coords){
      pair.latlng=coords;
      placeMarker(pair);
      map.setView(coords,17);
      setStatus('No.'+num+' GPS自動配置（遠景）: '+name);
    } else {
      setStatus('No.'+num+' 追加 → 配置モードONで地図をタップ');
    }
    renderSide();fixRep();
  });
}

// ===== 既存ペアへ写真追加 =====
function addPhotoToSlot(pairId, slot, file){
  const pair=pairs.find(p=>p.id===pairId);
  if(!pair)return;
  const url=URL.createObjectURL(file);
  const name=file.name.replace(/\.[^.]+$/,'');
  pair[slot]={url,file,name};
  // GPS未配置でGPS付き写真が来たら自動配置
  if(!pair.latlng){
    readExifGPS(file).then(coords=>{
      if(coords){pair.latlng=coords;placeMarker(pair);map.setView(coords,17);}
      renderSide();fixRep();updateMarker(pair);
    });
  } else {
    updateMarker(pair);
    renderSide();fixRep();
  }
  setStatus('No.'+pair.num+' '+(slot==='en'?'遠景':'近景')+'写真を追加: '+name);
}

// ===== GPS読取 =====
function readExifGPS(file){
  return new Promise(res=>{
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const buf=e.target.result,dv=new DataView(buf);
        if(dv.getUint16(0)!==0xFFD8){res(null);return;}
        let off=2;
        while(off<buf.byteLength-2){
          const mk=dv.getUint16(off);
          if(mk===0xFFE1){
            const ts=off+10,le=dv.getUint16(ts)===0x4949;
            const ru16=o=>dv.getUint16(ts+o,le),ru32=o=>dv.getUint32(ts+o,le);
            const ifd0=ru32(4),n=ru16(ifd0);let gp=null;
            for(let i=0;i<n;i++)if(ru16(ifd0+2+i*12)===0x8825){gp=ru32(ifd0+2+i*12+8);break;}
            if(!gp){res(null);return;}
            const gn=ru16(gp);let lr='N',mr='E',la=null,lo=null;
            for(let i=0;i<gn;i++){
              const b=gp+2+i*12,tg=ru16(b),vo=ru32(b+8);
              const dms=o=>{const g=o=>dv.getUint32(ts+o,le);return g(o)/g(o+4)+g(o+8)/g(o+12)/60+(g(o+20)?g(o+16)/g(o+20):0)/3600;};
              if(tg===1)lr=String.fromCharCode(dv.getUint8(ts+vo));
              else if(tg===2)la=dms(vo);
              else if(tg===3)mr=String.fromCharCode(dv.getUint8(ts+vo));
              else if(tg===4)lo=dms(vo);
            }
            if(la&&lo){res({lat:lr==='S'?-la:la,lng:mr==='W'?-lo:lo});return;}
            res(null);return;
          }
          if((mk&0xFF00)!==0xFF00)break;
          off+=2+dv.getUint16(off+2,false);
        }
        res(null);
      }catch(e){res(null);}
    };
    reader.readAsArrayBuffer(file);
  });
}

// ===== マーカー配置 =====
function placeMarker(pair,latlng){
  const pos=latlng||pair.latlng;if(!pos)return;
  pair.latlng=pos;
  if(pair.marker)map.removeLayer(pair.marker);
  pair.marker=createMarker(pair,pos);
  renderSide();
}

function createMarker(pair,pos){
  const sz=56;
  const enImg=pair.en?`<img src="${pair.en.url}" style="width:${sz}px;height:${sz*3/4|0}px">`:
    `<div style="width:${sz}px;height:${sz*3/4|0}px;background:#e0e0e0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#999">遠景</div>`;
  const knImg=pair.kn?`<img src="${pair.kn.url}" style="width:${sz}px;height:${sz*3/4|0}px">`:
    `<div style="width:${sz}px;height:${sz*3/4|0}px;background:#e8f5e8;display:flex;align-items:center;justify-content:center;font-size:9px;color:#999">近景</div>`;
  const icon=L.divIcon({
    className:'',
    html:`<div class="ph-mw" style="width:${sz*2+6}px">
      <div class="ph-mn">${pair.num}</div>
      <div class="pair-imgs">${enImg}${knImg}</div>
      <div class="ph-ml">No.${pair.num}</div>
    </div>`,
    iconSize:[sz*2+10,sz*3/4+20],iconAnchor:[sz+5,(sz*3/4|0)/2+10]
  });
  const marker=L.marker(pos,{icon,draggable:true}).addTo(map);
  marker.on('click',()=>showPairPopup(pair));
  marker.on('dragend',e=>{pair.latlng=e.target.getLatLng();setStatus('No.'+pair.num+' 位置を修正しました');renderSide();});
  return marker;
}

function updateMarker(pair){
  if(!pair.latlng||!pair.marker)return;
  const pos=pair.latlng;
  map.removeLayer(pair.marker);
  pair.marker=createMarker(pair,pos);
}

// ===== ペアポップアップ（地図上） =====
function showPairPopup(pair){
  if(!pair.latlng)return;
  const c=document.createElement('div');c.className='pair-popup';
  const hd=document.createElement('div');hd.className='pair-popup-hd';
  hd.innerHTML=`<span style="background:#E24B4A;color:#fff;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700">${pair.num}</span>
  <span>No.${pair.num}</span>`;
  c.appendChild(hd);
  const body=document.createElement('div');body.className='pair-popup-body';

  // 遠景列
  const enCol=document.createElement('div');enCol.className='pair-popup-col';
  const enLbl=document.createElement('div');enLbl.className='pair-popup-col-lbl lbl-en';enLbl.textContent='遠景';
  enCol.appendChild(enLbl);
  if(pair.en){
    const img=document.createElement('img');img.src=pair.en.url;
    img.onclick=()=>openPhotoModal(pair.en.url,'No.'+pair.num+' 遠景 '+pair.en.name);
    enCol.appendChild(img);
  } else {
    const empty=document.createElement('div');empty.className='empty-slot';empty.textContent='未追加';
    enCol.appendChild(empty);
    enCol.onclick=()=>{map.closePopup();openAddModal(pair.id,'en');};
  }

  // 近景列
  const knCol=document.createElement('div');knCol.className='pair-popup-col';
  const knLbl=document.createElement('div');knLbl.className='pair-popup-col-lbl lbl-kn';knLbl.textContent='近景';
  knCol.appendChild(knLbl);
  if(pair.kn){
    const img=document.createElement('img');img.src=pair.kn.url;
    img.onclick=()=>openPhotoModal(pair.kn.url,'No.'+pair.num+' 近景 '+pair.kn.name);
    knCol.appendChild(img);
  } else {
    const empty=document.createElement('div');empty.className='empty-slot';empty.textContent='未追加';
    const addBtn=document.createElement('button');
    addBtn.style.cssText='margin-top:4px;width:100%;padding:4px;border:1px solid #1D7A3A;border-radius:4px;background:#E3F5E8;color:#1D7A3A;font-size:11px;cursor:pointer;font-family:inherit';
    addBtn.textContent='近景を追加';
    addBtn.onclick=()=>{map.closePopup();openAddModal(pair.id,'kn');};
    knCol.appendChild(empty);
    knCol.appendChild(addBtn);
  }

  body.appendChild(enCol);body.appendChild(knCol);c.appendChild(body);
  L.popup({maxWidth:300,minWidth:220}).setLatLng(pair.latlng).setContent(c).openOn(map);
}

// ===== 配置モード =====
function toggleMode(){
  placeMode=!placeMode;
  document.getElementById('btn-mode').classList.toggle('mode-on',placeMode);
  document.getElementById('mode-txt').textContent=placeMode?'配置中...':'配置モード';
  map.getContainer().style.cursor=placeMode?'crosshair':'';
  setStatus(placeMode?'配置モードON — 地図をタップして箇所を配置':'配置モードOFF');
}

map.on('click',e=>{
  if(!placeMode)return;
  const pair=pairs.find(p=>p.id===activePairId&&!p.latlng);
  if(!pair){
    // 未配置のペアを探す
    const unplaced=pairs.find(p=>!p.latlng);
    if(!unplaced){setStatus('全ての箇所が配置済みです');return;}
    activePairId=unplaced.id;
    placeMarker(unplaced,e.latlng);
    setStatus('No.'+unplaced.num+' 配置完了（ドラッグで位置修正可）');
    const next=pairs.find(p=>!p.latlng&&p.id!==unplaced.id);
    if(next)activePairId=next.id;
    renderSide();return;
  }
  placeMarker(pair,e.latlng);
  setStatus('No.'+pair.num+' 配置完了（ドラッグで位置修正可）');
  const next=pairs.find(p=>!p.latlng&&p.id!==pair.id);
  if(next)activePairId=next.id;
  renderSide();
});

// ===== サイドパネル描画 =====
function renderSide(){
  const list=document.getElementById('photo-list');
  if(!pairs.length){
    list.innerHTML='<div id="empty-hint">①写真追加<br>②配置モードON<br>③地図をタップ<br><br>同じ箇所の<br>遠景・近景を<br>ペアで管理</div>';
    return;
  }
  list.innerHTML='';
  pairs.forEach(pair=>{
    const item=document.createElement('div');
    item.className='pair-item'+(pair.id===activePairId&&!pair.latlng?' active-pair':'');

    // ヘッダー
    const hd=document.createElement('div');hd.className='pair-hd';
    hd.onclick=()=>{if(pair.latlng){map.setView(pair.latlng,17);showPairPopup(pair);}};
    const no=document.createElement('span');no.className='pair-no';no.textContent=pair.num;
    const ll=document.createElement('span');ll.className='pair-latlng';
    ll.textContent=pair.latlng?`${pair.latlng.lat.toFixed(5)},${pair.latlng.lng.toFixed(5)}`:'未配置';
    const del=document.createElement('button');del.className='pair-del';del.textContent='✕';
    del.onclick=ev=>{ev.stopPropagation();removePair(pair.id);};
    hd.appendChild(no);hd.appendChild(ll);hd.appendChild(del);

    // ボディ（遠景・近景）
    const body=document.createElement('div');body.className='pair-body';

    ['en','kn'].forEach(slot=>{
      const col=document.createElement('div');col.className='pair-slot';
      const lbl=document.createElement('div');
      lbl.className='pair-slot-lbl '+(slot==='en'?'lbl-en':'lbl-kn');
      lbl.textContent=slot==='en'?'遠景':'近景';
      col.appendChild(lbl);
      if(pair[slot]){
        const img=document.createElement('img');img.className='pair-thumb';img.src=pair[slot].url;
        img.onclick=ev=>{ev.stopPropagation();openPhotoModal(pair[slot].url,'No.'+pair.num+(slot==='en'?' 遠景':' 近景')+' '+pair[slot].name);};
        col.appendChild(img);
      } else {
        const add=document.createElement('div');add.className='pair-add';add.textContent='+';
        add.onclick=ev=>{ev.stopPropagation();openAddModal(pair.id,slot);};
        col.appendChild(add);
      }
      body.appendChild(col);
    });

    item.appendChild(hd);item.appendChild(body);list.appendChild(item);
  });
}

function removePair(id){
  const idx=pairs.findIndex(p=>p.id===id);if(idx<0)return;
  if(pairs[idx].marker)map.removeLayer(pairs[idx].marker);
  map.closePopup();pairs.splice(idx,1);
  if(activePairId===id)activePairId=pairs.length?pairs[0].id:null;
  renderSide();setStatus('箇所を削除しました');
}

function clearAll(){
  if(!pairs.length)return;
  if(!confirm('全ての箇所を削除しますか？'))return;
  pairs.forEach(p=>{if(p.marker)map.removeLayer(p.marker);});
  pairs.length=0;activePairId=null;map.closePopup();
  renderSide();setStatus('全削除しました');
}

// ===== HTML出力 =====
function exportHTML(){
  const placed=pairs.filter(p=>p.latlng);
  if(!placed.length){alert('箇所を地図上に配置してから保存してください');return;}
  closeSaveModal();setStatus('HTMLファイルを生成中...');

  const toB64=file=>new Promise(res=>{
    const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(file);
  });

  const tasks=placed.map(p=>Promise.all([
    p.en?toB64(p.en.file):Promise.resolve(null),
    p.kn?toB64(p.kn.file):Promise.resolve(null),
  ]).then(([enB64,knB64])=>({...p,enB64,knB64})));

  Promise.all(tasks).then(phs=>{
    const center=map.getCenter(),zoom=map.getZoom();
    const layerKey=document.getElementById('map-sel').value;
    const tile=TILES[layerKey];
    const now=new Date();
    const ts=now.getFullYear()+'/'+(now.getMonth()+1).toString().padStart(2,'0')+'/'+now.getDate().toString().padStart(2,'0')+' '+now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');

    const popups=phs.map(p=>`
<div id="pm${p.id}" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:16px" onclick="this.style.display='none'">
  <div style="color:#fff;font-size:14px;font-weight:600">No.${p.num}</div>
  <div style="display:flex;gap:16px;align-items:flex-start">
    ${p.enB64?`<div style="text-align:center"><div style="background:#185FA5;color:#fff;font-size:11px;padding:2px 12px;border-radius:4px;margin-bottom:6px">遠景</div><img src="${p.enB64}" style="max-width:42vw;max-height:65vh;object-fit:contain;border-radius:8px;display:block" onclick="event.stopPropagation()"></div>`:''}
    ${p.knB64?`<div style="text-align:center"><div style="background:#1D7A3A;color:#fff;font-size:11px;padding:2px 12px;border-radius:4px;margin-bottom:6px">近景</div><img src="${p.knB64}" style="max-width:42vw;max-height:65vh;object-fit:contain;border-radius:8px;display:block" onclick="event.stopPropagation()"></div>`:''}
  </div>
  <button style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:8px 28px;font-size:14px;cursor:pointer" onclick="document.getElementById('pm${p.id}').style.display='none'">閉じる</button>
</div>`).join('');

    const dataJson=JSON.stringify(phs.map(p=>({
      id:p.id,num:p.num,lat:p.latlng.lat,lng:p.latlng.lng,
      enB64:p.enB64,knB64:p.knB64,
      enName:p.en?p.en.name:'',knName:p.kn?p.kn.name:''
    })));

    const html=`<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>災害調査写真配置図 ${ts}</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>
<style>*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
#hd{padding:8px 14px;background:#1a4f8a;color:#fff;display:flex;align-items:center;justify-content:space-between;font-size:13px}
#map{height:calc(100vh - 36px)}
.ph-mw{background:#fff;border:2px solid #378ADD;border-radius:6px;padding:2px;box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer}
.ph-mw .pi{display:flex;gap:2px}.ph-mw .pi img{display:block;border-radius:2px;object-fit:cover}
.ph-mw .pl{font-size:8px;text-align:center;background:rgba(0,0,0,.65);color:#fff;padding:1px 3px;border-radius:2px;margin-top:1px}
.ph-mn{position:absolute;top:-8px;left:-8px;width:18px;height:18px;background:#E24B4A;color:#fff;border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;line-height:1}
</style></head><body>
<div id="hd"><b>災害調査写真配置図</b><span style="opacity:.8;font-size:11px">${ts} / ${phs.length}箇所</span></div>
<div id="map"></div>
${popups}
<script>
const map=L.map('map').setView([${center.lat},${center.lng}],${zoom});
L.tileLayer('${tile.url}',{attribution:'${tile.attr}',maxZoom:${tile.max}}).addTo(map);
const data=${dataJson};
const sz=56;
data.forEach(p=>{
  const mk=(b64,label)=>b64?'<img src="'+b64+'" style="width:'+sz+'px;height:'+(sz*3/4|0)+'px">':'<div style="width:'+sz+'px;height:'+(sz*3/4|0)+'px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:9px;color:#999">'+label+'</div>';

    html:'<div class="ph-mw" style="width:'+(sz*2+6)+'px"><div class="ph-mn">'+p.num+'</div><div class="pi">'+mk(p.enB64,'遠景')+mk(p.knB64,'近景')+'</div><div class="pl">No.'+p.num+'</div></div>',
    iconSize:[sz*2+10,(sz*3/4|0)+20],iconAnchor:[sz+5,(sz*3/4|0)/2+10]});
  L.marker([p.lat,p.lng],{icon}).addTo(map).on('click',()=>{document.getElementById('pm'+p.id).style.display='flex';});
});
<\/script></body></html>`;

    const fname='配置図_'+now.getFullYear()+('0'+(now.getMonth()+1)).slice(-2)+('0'+now.getDate()).slice(-2)+'_'+('0'+now.getHours()).slice(-2)+('0'+now.getMinutes()).slice(-2)+'.html';
    const blob=new Blob([html],{type:'text/html'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;a.click();
    setStatus('HTMLファイルを保存しました: '+fname);
  });
}

function exportPrint(){
  if(!pairs.filter(p=>p.latlng).length){alert('箇所を配置してから印刷してください');return;}
  window.print();
}

map.on('locationfound',()=>{setStatus('現在地を取得しました');fixRep();});
